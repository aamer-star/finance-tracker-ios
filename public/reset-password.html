<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Finance Tracker</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #0a0d12; color: #fff; margin: 0; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { width: 100%; max-width: 380px; background: #161a21;
            border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 28px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p.sub { color: rgba(255,255,255,0.55); font-size: 14px; margin: 0 0 20px; }
    label { font-size: 13px; color: rgba(255,255,255,0.7); display: block; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.12); background: #0a0d12; color: #fff;
            font-size: 16px; margin-bottom: 16px; }
    button { width: 100%; padding: 13px; border: 0; border-radius: 12px; cursor: pointer;
             background: #22d46f; color: #000; font-weight: 600; font-size: 16px; }
    button:disabled { opacity: 0.5; cursor: default; }
    .msg { font-size: 14px; margin-top: 14px; text-align: center; }
    .err { color: #ef5350; } .ok { color: #22d46f; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Set a new password</h1>
    <p class="sub" id="sub">Choose a new password for your account.</p>
    <form id="form">
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" minlength="6" placeholder="At least 6 characters" required />
      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password" minlength="6" placeholder="Re-enter password" required />
      <button id="btn" type="submit">Update Password</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    // Supabase puts the recovery token in the URL hash: #access_token=...&type=recovery
    function tokenFromHash() {
      const hash = window.location.hash.replace(/^#/, '');
      return new URLSearchParams(hash).get('access_token');
    }
    const token = tokenFromHash();
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');

    if (!token) {
      document.getElementById('sub').textContent =
        'Open this page from the reset link in your email.';
      btn.disabled = true;
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      const pw = document.getElementById('pw').value;
      const pw2 = document.getElementById('pw2').value;
      if (pw !== pw2) { msg.className = 'msg err'; msg.textContent = 'Passwords do not match.'; return; }
      btn.disabled = true; btn.textContent = 'Updating…';
      try {
        const r = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ access_token: token, password: pw }),
        });
        const data = await r.json();
        if (r.ok && data.ok) {
          msg.className = 'msg ok';
          msg.textContent = 'Password updated. You can now sign in with your new password in the app.';
          document.getElementById('form').style.display = 'none';
        } else {
          msg.className = 'msg err';
          msg.textContent = data.error || 'Something went wrong. Please request a new link.';
          btn.disabled = false; btn.textContent = 'Update Password';
        }
      } catch {
        msg.className = 'msg err';
        msg.textContent = 'Network error. Please try again.';
        btn.disabled = false; btn.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
